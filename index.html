<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Dinner Planner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#232B2E" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dinner" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <header class="app">
    <h1>Dinner Planner</h1>
    <button id="syncChip" class="sync-chip" title="Sync now">&hellip;</button>
  </header>

  <main>
    <section id="tab-week" class="tab active"></section>
    <section id="tab-meals" class="tab"></section>
    <section id="tab-shop" class="tab"></section>
    <section id="tab-settings" class="tab"></section>
  </main>

  <nav class="tabs">
    <button data-tab="week" class="active"><span class="glyph">&#167;</span>Week</button>
    <button data-tab="meals"><span class="glyph">&#182;</span>Meals</button>
    <button data-tab="shop"><span class="glyph">&#10003;</span>Shop</button>
    <button data-tab="settings"><span class="glyph">&#8734;</span>Setup</button>
  </nav>

  <div id="overlay"></div>

  <script type="module" src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator && location.protocol === "https:") {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
